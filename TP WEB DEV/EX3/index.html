<body>
    
    <h1>tableau triee est :</h1>

    <script>
        let table = [2,5,1,3,4,6,10,20];
        console.log(triee(table));
        function triee(table){
            
            let i;
            for(i=0;i<table.length;i++){
                let max = i;
                for(let j=i+1;j<table.length;j++)
                if(table[max] > table[j]){
                    max = j;
                }
                let temp = table[i];
                table[i]=table[max];
                table[max]=temp;

                console.log(table[i]);
            }
            
        }
    </script>
    

</body>
